syntax = "proto3";
package com.mycompany.smartzerohungersystem.distributionoptimizer;

import "google/protobuf/empty.proto";

message RegionRequest {
  string region = 1;
}

message DeliveryInstruction {
  string vehicle = 1;
  string route   = 2;
  int32  quantity = 3;
}

message OptimizationSummary {
  int32 totalVehicles   = 1;
  int32 totalDeliveries = 2;
}

message AddDeliveryRequest {
  string vehicle = 1;
  string route = 2;
  int32 quantity = 3;
}

message AddDeliveryResponse {
  string status = 1;
}

service DistributionOptimizerService {
  rpc GetDistributionPlan (RegionRequest) returns (stream DeliveryInstruction);
  rpc OptimizeAll (google.protobuf.Empty) returns (OptimizationSummary);
  rpc AddDelivery (AddDeliveryRequest) returns (AddDeliveryResponse);
}
